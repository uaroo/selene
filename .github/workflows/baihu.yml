name: Build and Push Baihu Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 💡 优化：换成标准的 bash 并使用 $GITHUB_OUTPUT 转小写
      - name: Lowercase Repository Name
        id: lower-repo
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Baihu
          push: true
          tags: |
            ghcr.io/${{ steps.lower-repo.outputs.repository }}/foinspira:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.lower-repo.outputs.repository }}
            org.opencontainers.image.description=Baihu Docker Image
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
